[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openpi-navsim-sft"
version = "0.1.0"
description = "Three-camera pi0.5 NAVSIM trajectory flow matching and full-parameter SFT"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.8.0", "transformers==4.53.2", "numpy>=1.26,<3",
  "pillow>=10,<12", "safetensors>=0.5,<0.7", "sentencepiece==0.2.0",
  "PyYAML>=6,<7", "huggingface-hub>=0.33,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
checkpoint = ["jax[cpu]==0.5.3", "orbax-checkpoint==0.11.13", "google-crc32c>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
